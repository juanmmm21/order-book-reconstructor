[package]
name = "order-book-reconstructor-rs"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Optional Rust accelerator for order-book-reconstructor (L2 book levels)."
publish = false

[lib]
name = "order_book_reconstructor_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py311"] }
rust_decimal = "1"

[features]
# maturin enables this when building the wheel; `cargo test` links against libpython instead
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
