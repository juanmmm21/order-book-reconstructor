[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "order-book-reconstructor-rs"
version = "0.2.0"
description = "Optional Rust accelerator for order-book-reconstructor. Results are identical to the Python fallback."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.maturin]
features = ["extension-module"]
module-name = "order_book_reconstructor_rs"
