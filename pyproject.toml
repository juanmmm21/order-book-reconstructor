[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "order-book-reconstructor"
version = "0.2.0"
description = "In-memory L2 order book reconstructor with sorted bid/ask maintenance for live exchange depth streams."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "juanmmm21" }]
keywords = ["order-book", "l2", "depth", "binance", "coinbase", "market-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=12.0,<16",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.4",
]

rust = [
    "order-book-reconstructor-rs @ git+https://github.com/juanmmm21/order-book-reconstructor@feat/quant-roadmap#subdirectory=rust",
]

[project.scripts]
order-book-reconstructor = "order_book_reconstructor.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/order_book_reconstructor"]

[tool.hatch.build.targets.sdist]
include = ["src/order_book_reconstructor", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["order_book_reconstructor_rs"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
