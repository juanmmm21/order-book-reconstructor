[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "order-book-reconstructor"
version = "0.1.0"
description = "In-memory L2 order book reconstructor with sorted bid/ask maintenance for live exchange depth streams."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "juanmmm21" }]
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=12.0,<16",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/order_book_reconstructor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
